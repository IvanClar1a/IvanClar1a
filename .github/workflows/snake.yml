name: Generate Snake

# Configura cuándo se ejecutará la acción
on:
  schedule:
    # Se ejecuta automáticamente cada 24 horas
    - cron: "0 0 * * *"
  
  # Te permite ejecutar la acción manualmente desde la pestaña "Actions"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Genera la animación de la serpiente
      - uses: Platane/snk@v3
        with:
          # Tu nombre de usuario de GitHub
          github_user_name: IvanClar1a
          
          # Archivos que se van a generar (incluyendo el modo oscuro que usaste)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Guarda los archivos generados en una rama secundaria llamada 'output'
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
